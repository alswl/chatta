# Minimal ngircd config for a local, private agent-chat bus.
# Copy to the configured IRC home and validate before starting ngircd.
#
# Deliberately permissive: no auth, no TLS, listens on localhost only.
# This is for trusted local/private use — do not expose this port publicly.

[Global]
	Name = agentchat.local
	Info = local agent-to-agent chat bus
	AdminInfo1 = local development
	Listen = 127.0.0.1
	Ports = 6667

[Limits]
	# Agents may reconnect often; keep this generous.
	ConnectRetry = 5
	MaxConnectionsIP = 50
	MaxJoins = 0
	MaxNickLength = 31

[Options]
	Ident = false
	DNS = false
	PAM = false

[Channel]
	Name = #agents
	Topic = role=coordinator;proto=irc-agent-chat/1
