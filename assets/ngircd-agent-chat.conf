# Minimal ngircd config for a local, private agent-chat bus.
# Copy to e.g. ~/.irc-agent/ngircd.conf and run:
#   ngircd --nodaemon --config ~/.irc-agent/ngircd.conf
#
# Deliberately permissive: no auth, no TLS, listens on localhost only.
# This is for trusted local/private use (agents collaborating on the same
# machine or LAN) — do not expose this port to the public internet.

[Global]
	Name = agentchat.local
	Info = local agent-to-agent chat bus
	AdminInfo1 = local development
	Listen = 127.0.0.1
	Ports = 6667

[Limits]
	# Agents may reconnect often (one-shot "send" calls); keep this generous.
	ConnectRetry = 5
	# Default 5 is too tight for many local agent sessions + frequent reconnects.
	MaxConnectionsIP = 50
	MaxJoins = 0
	MaxNickLength = 31

[Options]
	# No ident lookups — agent sandboxes usually don't run identd, and
	# waiting on it would just slow down every connection.
	Ident = false
	# No reverse-DNS lookups — same reason, and it's pointless on localhost.
	DNS = false
	# No PAM/password auth: this server has no built-in access control,
	# by design (see references/a2a-comparison.md). Keep it off a shared
	# or public network.
	PAM = false

[Channel]
	Name = #agents
	Topic = role=coordinator;proto=irc-agent-chat/1
